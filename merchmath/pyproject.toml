[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merchmath"
version = "0.1.0"
description = "Tested retail merchandising formulas: sell-through, cover, WSSI, open-to-buy, VAT-aware margin, broken sizes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["retail", "merchandising", "planning", "open-to-buy", "wssi", "sell-through", "margin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
